[package]
name = "rustybox_utils"
version = "0.1.4"
edition = "2024"
description = "Rust implementation of common *nix command-line utilities"
license = "MPL-2.0"
authors = ["Semyon Tsarev"]
readme = "README.md"
repository = "https://github.com/SemyonTs/RustyBox"
keywords = ["cli", "utilities", "unix", "command-line"]
categories = ["command-line-utilities"]

[[bin]]
name = "rustybox"
path = "src/main.rs"

[features]
default = []
UNSTABLE_SH = []

[dependencies]
linkme = "0.3"
libc = "0.2"
filetime = "0.2"
chrono = "0.4"
regex = "1"
lexopt = "0.3"
rustyline = "18"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
rstest = "0.26"