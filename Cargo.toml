[package]
name = "rustybox"
version = "0.1.2-rc.1"
edition = "2024"
description = "Rust implementation of common *nix command-line utilities, inspired by Toybox"
license = "MPL-2.0"
authors = ["Semyon Tsarev"]

[[bin]]
name = "rustybox"
path = "src/main.rs"

[dependencies]
linkme = "0.3"
libc = "0.2"
filetime = "0.2"
chrono = "0.4"
regex = "1"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
rstest = "0.26"
lexopt = "0.3"